<!doctype html>
<html><head><meta charset="utf-8"><style>
body{font-family:system-ui;width:290px;padding:10px;margin:0}button{display:block;width:100%;margin:6px 0;padding:8px;font-size:13px;cursor:pointer}
#status{font-size:12px;color:#555;min-height:1.2em}input[type=text],input[type=password]{width:100%;box-sizing:border-box;margin-bottom:6px;font-size:12px}

</style></head><body>
<strong>🧠 Sergio Brain</strong>
<input id="engine" type="text" placeholder="http://127.0.0.1:8765"><input id="token" placeholder="token (opcional)" type="password">
<button id="sel">Save selection</button>
<button id="url">Save URL</button>
<button id="article">Save article (main text)</button>
<button id="page">Save page (full text)</button>
<div id="ai">
  <button id="aichat">💬 Save AI conversation</button>
  <div id="aiInfo"></div>
  <label><input id="autosave" type="checkbox"> Auto-guardar conversaciones de ChatGPT / Claude / Gemini</label>
</div>
